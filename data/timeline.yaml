    year: -1650
    circa: true
    era: rivian
    title: Set-Ahotep-Imekh ends the First-and-Only and casts his body into the estuary
    match: "First-and-Only's body|casts his body into the estuary"
    sources: ["Timekeeping/Timelines/Timeline of the Circle Sea.md", "Geography/Regions/Circulean/Merhal.md"]

