# Timeline of the Circle Sea as structured data.
#
# year / end: integers on the civil count. AR years are positive, BR years
#   negative, the Fall of Reme is 0. `end` is set only for spans.
# circa: true where the lorebooks say "around" or "c.".
# match: a regular expression naming the event in prose. tools/check_timeline.py
#   finds every sentence in the content files that matches it and carries an explicit year,
#   and reports sentences whose years disagree with this file.
# sources: lorebooks that state the date.
#
# Drafted from "Timekeeping/Timelines/Timeline of the Circle Sea.md" and the polity files
# at the migration (November 2026). Where lorebooks disagree, this file follows
# the Timeline and the disagreement is listed by the checker.

eras:
  - {id: prehistory, name: Prehistory, end: -2000}
  - {id: rivian, name: The Rivian Epoch, start: -2000, end: -1001}
  - {id: remean, name: The Remean Era, start: -1100, end: 100}
  - {id: enlightenment, name: The Age of Enlightenment, start: 0, end: 400}
  - {id: dark_ages, name: The Dark Ages, start: 300, end: 1000}
  - {id: corsairs, name: The Age of Corsairs, start: 900, end: 1300}
  - {id: aetheric, name: The Aetheric Age, start: 1200, end: 1500}
  - {id: imperial, name: The Imperial Age, start: 1400, end: 1600}

events:
